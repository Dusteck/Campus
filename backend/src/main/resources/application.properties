spring.application.name=backend
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/campusops?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
spring.datasource.username=campusops_app
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Expose health information only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Readiness requires both the application and database to be ready
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db